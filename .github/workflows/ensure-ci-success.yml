name: Ensure CI Success

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-ci:
    name: Ensure CI Success
    runs-on: ubuntu-latest
    steps:
      - name: Ensure CI Success
        uses: DataDog/ensure-ci-success@v2.3.0
        with:
          initial-delay-seconds: 5
          max-retries: 5
          polling-interval-seconds: 60
          # ignored-name-patterns: "" # Opcional: ex. "lint,test-*"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          full-details-summary: false
